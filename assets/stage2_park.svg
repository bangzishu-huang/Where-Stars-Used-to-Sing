<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a9d6e8"/>
      <stop offset="100%" stop-color="#e9e2b8"/>
    </linearGradient>
    <linearGradient id="ground2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7fae5a"/>
      <stop offset="100%" stop-color="#5c8c41"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#sky2)"/>
  <circle cx="1300" cy="150" r="70" fill="#ffe9a8"/>
  <rect x="0" y="620" width="1600" height="280" fill="url(#ground2)"/>

  <!-- soft distant hills -->
  <path d="M0,620 Q400,540 800,610 T1600,600 V620 H0 Z" fill="#6fa050" opacity="0.6"/>

  <!-- trees -->
  <g>
    <g transform="translate(220,600)">
      <rect x="-10" y="0" width="20" height="70" fill="#6b4a2f"/>
      <circle cx="0" cy="-30" r="70" fill="#4f8f3f"/>
      <circle cx="-40" cy="0" r="50" fill="#5a9a48"/>
      <circle cx="45" cy="5" r="55" fill="#4f8f3f"/>
    </g>
    <g transform="translate(1330,580)">
      <rect x="-10" y="0" width="20" height="80" fill="#6b4a2f"/>
      <circle cx="0" cy="-35" r="80" fill="#5a9a48"/>
      <circle cx="-50" cy="0" r="55" fill="#4f8f3f"/>
      <circle cx="55" cy="0" r="60" fill="#5a9a48"/>
    </g>
    <g transform="translate(760,650)">
      <rect x="-8" y="0" width="16" height="55" fill="#6b4a2f"/>
      <circle cx="0" cy="-25" r="55" fill="#5a9a48"/>
    </g>
  </g>

  <!-- birds, small v-shapes -->
  <g stroke="#3a3a3a" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M 400 180 q 14 -14 28 0 q 14 -14 28 0"/>
    <path d="M 900 130 q 12 -12 24 0 q 12 -12 24 0"/>
    <path d="M 1080 220 q 10 -10 20 0 q 10 -10 20 0"/>
  </g>

  <!-- bench with grandmother silhouette -->
  <g transform="translate(430,680)">
    <rect x="-60" y="20" width="120" height="10" fill="#7a5a3a"/>
    <rect x="-55" y="-10" width="10" height="30" fill="#7a5a3a"/>
    <rect x="45" y="-10" width="10" height="30" fill="#7a5a3a"/>
    <circle cx="0" cy="-10" r="16" fill="#4a3b33"/>
    <path d="M -14,4 Q 0,-6 14,4 L 12,40 L -12,40 Z" fill="#4a3b33"/>
  </g>

  <!-- pigeons -->
  <g fill="#8a8a8a">
    <ellipse cx="470" cy="742" rx="10" ry="6"/>
    <ellipse cx="495" cy="748" rx="10" ry="6"/>
    <ellipse cx="450" cy="750" rx="10" ry="6"/>
  </g>
</svg>
