<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a6270"/>
      <stop offset="100%" stop-color="#8a8f96"/>
    </linearGradient>
    <linearGradient id="ground1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6b6f73"/>
      <stop offset="100%" stop-color="#4a4d50"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#sky1)"/>
  <rect x="0" y="700" width="1600" height="200" fill="url(#ground1)"/>

  <!-- distant flat skyline -->
  <g fill="#565b60">
    <rect x="40" y="430" width="140" height="270"/>
    <rect x="200" y="380" width="110" height="320"/>
    <rect x="330" y="470" width="160" height="230"/>
    <rect x="520" y="350" width="130" height="350"/>
    <rect x="670" y="420" width="150" height="280"/>
    <rect x="850" y="390" width="120" height="310"/>
    <rect x="1000" y="460" width="170" height="240"/>
    <rect x="1200" y="360" width="140" height="340"/>
    <rect x="1370" y="440" width="150" height="260"/>
  </g>
  <!-- window grid, uniform + dim (efficiency, no warmth) -->
  <g fill="#8d9298" opacity="0.5">
    <rect x="60" y="450" width="10" height="14"/><rect x="90" y="450" width="10" height="14"/><rect x="120" y="450" width="10" height="14"/>
    <rect x="60" y="490" width="10" height="14"/><rect x="90" y="490" width="10" height="14"/><rect x="120" y="490" width="10" height="14"/>
    <rect x="220" y="410" width="10" height="14"/><rect x="250" y="410" width="10" height="14"/><rect x="280" y="410" width="10" height="14"/>
    <rect x="220" y="450" width="10" height="14"/><rect x="250" y="450" width="10" height="14"/><rect x="280" y="450" width="10" height="14"/>
    <rect x="540" y="390" width="10" height="14"/><rect x="570" y="390" width="10" height="14"/><rect x="600" y="390" width="10" height="14"/>
    <rect x="1020" y="500" width="10" height="14"/><rect x="1060" y="500" width="10" height="14"/><rect x="1100" y="500" width="10" height="14"/>
    <rect x="1220" y="400" width="10" height="14"/><rect x="1260" y="400" width="10" height="14"/><rect x="1300" y="400" width="10" height="14"/>
  </g>

  <!-- one dead tree, mentioned in the script -->
  <g stroke="#3f4245" stroke-width="6" fill="none" stroke-linecap="round">
    <path d="M 1470 700 L 1470 600"/>
    <path d="M 1470 630 L 1440 590"/>
    <path d="M 1470 630 L 1500 585"/>
    <path d="M 1470 660 L 1450 615"/>
    <path d="M 1470 660 L 1495 620"/>
  </g>

  <!-- street clock, flat and plain -->
  <g transform="translate(760,660)">
    <rect x="-4" y="0" width="8" height="50" fill="#3f4245"/>
    <circle cx="0" cy="-20" r="26" fill="#7d8288" stroke="#3f4245" stroke-width="3"/>
    <line x1="0" y1="-20" x2="0" y2="-34" stroke="#3f4245" stroke-width="2"/>
    <line x1="0" y1="-20" x2="10" y2="-14" stroke="#3f4245" stroke-width="2"/>
  </g>

  <!-- ground line / bulletin board post -->
  <rect x="140" y="640" width="70" height="90" fill="#5a5e62" opacity="0.9"/>
</svg>
