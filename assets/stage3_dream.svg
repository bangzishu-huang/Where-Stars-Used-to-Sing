<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1f3d"/>
      <stop offset="60%" stop-color="#2e3f66"/>
      <stop offset="100%" stop-color="#3f6b7a"/>
    </linearGradient>
    <radialGradient id="oceanGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#5fd0c0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#1f5c66" stop-opacity="0.3"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#sky3)"/>

  <!-- stars -->
  <g fill="#ffffff">
    <circle cx="120" cy="90" r="2.5"/><circle cx="260" cy="60" r="1.8"/><circle cx="380" cy="140" r="2"/>
    <circle cx="520" cy="70" r="2.2"/><circle cx="700" cy="110" r="1.6"/><circle cx="860" cy="50" r="2.4"/>
    <circle cx="980" cy="130" r="1.8"/><circle cx="1120" cy="80" r="2"/><circle cx="1260" cy="60" r="2.6"/>
    <circle cx="1400" cy="120" r="1.8"/><circle cx="1500" cy="70" r="2.2"/>
  </g>

  <!-- glowing ocean at the horizon -->
  <rect x="0" y="620" width="1600" height="280" fill="#0e2430"/>
  <ellipse cx="800" cy="640" rx="900" ry="90" fill="url(#oceanGlow)"/>

  <!-- big tree, silhouette -->
  <g transform="translate(1250,640)">
    <rect x="-20" y="0" width="40" height="140" fill="#12181f"/>
    <circle cx="0" cy="-60" r="140" fill="#12181f"/>
    <circle cx="-90" cy="0" r="90" fill="#12181f"/>
    <circle cx="100" cy="10" r="100" fill="#12181f"/>
  </g>

  <!-- fireflies -->
  <g fill="#fff2b0">
    <circle cx="300" cy="520" r="4"/><circle cx="340" cy="560" r="3"/><circle cx="270" cy="580" r="3.5"/>
    <circle cx="420" cy="500" r="3"/><circle cx="200" cy="600" r="4"/><circle cx="500" cy="560" r="3"/>
    <circle cx="620" cy="520" r="3.5"/><circle cx="680" cy="590" r="3"/>
  </g>

  <!-- sign post -->
  <g transform="translate(300,650)">
    <rect x="-6" y="0" width="12" height="70" fill="#25313a"/>
    <rect x="-45" y="-25" width="90" height="35" fill="#3a4a54" transform="rotate(-8)"/>
  </g>
</svg>
